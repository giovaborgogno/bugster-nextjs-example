name: Navigation menu accessibility
page: /
page_path: app/page.tsx
task: Verify navigation menu is accessible and functional
steps:
- Navigate to the homepage
- Verify either FreeDelivery or SummerSale banner appears first (random order)
- Locate the navigation menu
- Verify all menu items are visible
- Click on navigation links to verify they are functional
