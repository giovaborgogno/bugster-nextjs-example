name: Cart quantity adjustment functionality
page: cart
page_path: app/cart/page.tsx
task: Verify users can increase and decrease item quantity in cart
steps:
- Add a product to cart
- Navigate to the cart page
- Locate quantity adjustment controls
- Increase quantity by clicking '+' button
- Verify quantity increases and price updates
- Decrease quantity by clicking '-' button
- Verify quantity decreases and price updates
expected_result: Item quantity changes and cart totals update correctly
