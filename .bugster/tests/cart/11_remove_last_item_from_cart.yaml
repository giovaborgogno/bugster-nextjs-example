name: Remove last item from cart
page: /cart
page_path: app/cart/page.tsx
task: Verify removing the last item from cart shows empty state
steps:
- Add a single product to cart
- Navigate to the cart page
- Click the remove button on the item
- Verify the item is removed
- Verify the empty cart message is displayed
expected_result: Empty cart message should appear after removing the last item
