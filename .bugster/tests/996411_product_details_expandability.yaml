name: Product details expandability
page: /
page_path: app/page.tsx
task: Verify product details section is expandable
steps:
- Navigate to the homepage
- Note that either the free delivery banner or summer sale banner may appear first
  (random order)
- Locate the product details section below the banners
- Click on expand/collapse controls if present
- Verify additional product information is displayed when expanded
- Verify information is hidden when collapsed
- Confirm expandability works regardless of banner order
expected_result: Product details can be expanded to show more information, and the
  expanded view is visible regardless of whether free delivery banner appears first
  or after summer sale banner
